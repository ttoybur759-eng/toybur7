<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 আপনার জন্য বিশেষ 💖</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
body { margin:0; padding:0; font-family:'Arial', sans-serif; text-align:center; background: linear-gradient(135deg, #ff9a9e, #fad0c4); color:#fff; min-height:100vh; }
h1, h2 { font-family:'Pacifico', cursive; font-size:3em; margin-top:50px; }
#loveMessage { font-size:1.5em; margin:20px; white-space:pre-line; }
#envelope { margin-top:40px; width:120px; height:80px; background:#fff; color:#ff1493; font-weight:bold; display:flex; justify-content:center; align-items:center; margin-left:auto; margin-right:auto; border-radius:10px; cursor:pointer; box-shadow: 2px 2px 10px rgba(0,0,0,0.3); transition: transform 0.3s; }
#envelope:hover { transform: scale(1.1); }
#proposal { display:none; font-size:1.5em; margin-top:20px; color:#ff1493; white-space:pre-line; }
</style>
</head>
<body>

<h2>💖 আপনার জন্য 💖</h2>
<p id="loveMessage"></p>
<div id="envelope">✉️ খাম খুলুন</div>
<p id="proposal"></p>

<script>
// URL থেকে ডেটা নেওয়া
const urlParams = new URLSearchParams(window.location.search);
const yourName = urlParams.get('yourName');
const friendName = urlParams.get('friendName');
const message = urlParams.get('message');

if(yourName && friendName && message){
    document.getElementById('loveMessage').innerText = `${decodeURIComponent(friendName)},\n${decodeURIComponent(message)}`;
}

document.getElementById('envelope').onclick = function(){
    document.getElementById('proposal').style.display = "block";
    document.getElementById('proposal').innerText = `💖 ${decodeURIComponent(yourName)} তোমাকে প্রপোজ করছে! 💖\nI love you ${decodeURIComponent(friendName)} ❤️`;
}
</script>

</body>
</html>
